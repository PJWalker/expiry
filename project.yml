# Generate the Xcode project with: brew install xcodegen && xcodegen
name: MailExpiry
options:
  bundleIdPrefix: com.example.mailexpiry   # TODO: change to your own prefix
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""                   # TODO: your Team ID
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MailExpiry:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "Mail Expiry checks and archives expired messages in Mail."
    entitlements:
      path: App/MailExpiry.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups: ["$(TeamIdentifierPrefix)com.example.mailexpiry"]
    dependencies:
      - target: MailExpiryExtension
  MailExpiryExtension:
    type: app-extension
    platform: macOS
    sources: [Extension, Shared]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Mail Expiry
        NSExtension:
          NSExtensionPointIdentifier: com.apple.email.extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MailExtension
          NSExtensionAttributes:
            MEExtensionCapabilities: [MEMessageActionHandler]
    entitlements:
      path: Extension/MailExpiryExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["$(TeamIdentifierPrefix)com.example.mailexpiry"]
    dependencies:
      - sdk: MailKit.framework
